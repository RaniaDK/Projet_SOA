services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hotelsync-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hotelsync-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ms-users:
    build: ./ms-users
    container_name: hotelsync-ms-users
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "50051:50051"
    volumes:
      - ./proto:/proto
    environment:
      USERS_PORT: 50051
      KAFKA_BROKER: kafka:9092
      JWT_SECRET: hotelsync_jwt_secret_2025

  ms-bookings:
    build: ./ms-bookings
    container_name: hotelsync-ms-bookings
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "50052:50052"
    volumes:
      - ./proto:/proto
    environment:
      BOOKINGS_PORT: 50052
      KAFKA_BROKER: kafka:9092

  ms-notifications:
    build: ./ms-notifications
    container_name: hotelsync-ms-notifications
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "50053:50053"
    volumes:
      - ./proto:/proto
    environment:
      NOTIFS_PORT: 50053
      KAFKA_BROKER: kafka:9092

  api-gateway:
    build: ./api-gateway
    container_name: hotelsync-api-gateway
    depends_on:
      - ms-users
      - ms-bookings
      - ms-notifications
    ports:
      - "4000:4000"
    volumes:
      - ./proto:/proto
    environment:
      GATEWAY_PORT: 4000
      USERS_ADDR: ms-users:50051
      BOOKINGS_ADDR: ms-bookings:50052
      NOTIFS_ADDR: ms-notifications:50053
      JWT_SECRET: hotelsync_jwt_secret_2025